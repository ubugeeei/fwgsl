name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moonbit:
    name: MoonBit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: moon version
        run: moon version
      - name: moon check
        run: moon check
      - name: moon test
        run: moon test
      # Build the wasm-gc target so the playground's deploy step in
      # `pages.yml` can rely on the linked artifact existing. Catches
      # link / export configuration errors at PR time instead of at
      # deploy time. The artifact discovery `find` lives here too so
      # the path is logged in PR runs; pages.yml uses the same
      # pattern when copying into `playground/pkg/`.
      - name: moon build (wasm-gc)
        run: |
          moon build --target wasm-gc --release
          echo "=== _build tree ==="
          ls -la _build/ || true
          echo "=== all .wasm files ==="
          find _build -name '*.wasm' || true
          echo "=== all .core files ==="
          find _build -name '*.core' || true

  playground-artifact:
    name: Playground artifact
    runs-on: ubuntu-latest
    needs: moonbit
    steps:
      - uses: actions/checkout@v4
      - name: Upload playground artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground
          path: playground/
        if: success()
