name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The playground's WASM bindings now come from `moonbit/wasm` and
      # target `wasm-gc`. The JS-import shim that wraps the moonbit-built
      # `.wasm` is still being wired up (the playground currently expects
      # the old `wasm-pack` output under `playground/pkg/`); until that
      # bridge lands we publish the playground HTML / JS as-is so the
      # marketing page stays online. The previous Rust/wasm-pack build
      # step always failed silently after the migration in #4 and is
      # removed here.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
