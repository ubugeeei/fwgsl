name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build playground wasm
        run: |
          # `moonbit/wasm` is configured with `link.wasm-gc.exports`
          # and `is-main: true`, so `moon build --target wasm-gc
          # --release` drops the linked artifact at
          # `_build/wasm-gc/release/build/wasm/wasm.wasm`. Surface it
          # under `playground/pkg/fwgsl_wasm_bg.wasm`, which the
          # hand-written JS shim in `playground/pkg/fwgsl_wasm.js`
          # `fetch`es at runtime.
          set -euxo pipefail
          moon build --target wasm-gc --release
          WASM=_build/wasm-gc/release/build/wasm/wasm.wasm
          if [ ! -f "$WASM" ]; then
            echo "Expected $WASM to exist after moon build --release"
            echo "Available .wasm artifacts:"
            find _build -name '*.wasm' || true
            exit 1
          fi
          mkdir -p playground/pkg
          cp "$WASM" playground/pkg/fwgsl_wasm_bg.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
