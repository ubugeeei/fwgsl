name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build playground wasm
        run: |
          # `moonbit/wasm` is configured with `link.wasm-gc.exports`,
          # so `moon build --target wasm-gc --release` drops a linked
          # artifact somewhere under `_build/wasm-gc/`. The exact
          # path depends on the moonbit toolchain version, so we
          # discover it dynamically and fail loud if we can't find it.
          set -euxo pipefail
          moon build --target wasm-gc --release
          echo "=== all .wasm files ==="
          find _build -name '*.wasm' || true
          mkdir -p playground/pkg
          WASM=$(find _build -name '*.wasm' -path '*/wasm/*' | head -1)
          if [ -z "$WASM" ]; then
            WASM=$(find _build -name 'wasm.wasm' | head -1)
          fi
          if [ -z "$WASM" ]; then
            WASM=$(find _build -name '*.wasm' | head -1)
          fi
          if [ -z "$WASM" ]; then
            echo "No wasm artifact found under _build/"
            exit 1
          fi
          echo "Using $WASM"
          cp "$WASM" playground/pkg/fwgsl_wasm_bg.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
