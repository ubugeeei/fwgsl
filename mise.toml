[tools]
node = "22"

[tasks.check]
description = "Type-check the MoonBit workspace"
run = "moon check"

[tasks.build]
description = "Build the MoonBit workspace"
run = "moon build"

[tasks.test]
description = "Run MoonBit tests"
run = "moon test"

[tasks.fmt]
description = "Format MoonBit sources"
run = "moon fmt"

[tasks."fmt:check"]
description = "Check MoonBit formatting"
run = "moon fmt --check"

[tasks.dev]
description = "Start playground dev server (no rebuild)"
run = """
cd playground
echo "🚀 playground: http://localhost:3000"
python3 -m http.server 3000
"""

[tasks.playground]
description = "Serve playground"
run = """
cd playground
echo "🚀 playground: http://localhost:3000"
python3 -m http.server 3000
"""

# Keep the bump:* tasks for npm-style version bumps.
[tasks."bump:alpha"]
description = "Bump version to next alpha"
run = """
#!/usr/bin/env bash
set -euo pipefail
file="moon.mod.json"
current=$(grep '"version"' "$file" | head -1 | sed -E 's/.*"([0-9A-Za-z.+-]+)".*/\\1/')
echo "Current version: $current"
if [[ "$current" == *"-alpha."* ]]; then
  base="${current%-alpha.*}"
  num="${current##*-alpha.}"
  next=$((num + 1))
  new="${base}-alpha.${next}"
else
  new="${current}-alpha.1"
fi
echo "New version: $new"
sed -i '' "s/\\\"version\\\": \\\"${current}\\\"/\\\"version\\\": \\\"${new}\\\"/" "$file"
echo "Bumped to $new"
"""

[tasks."bump:release"]
description = "Remove pre-release suffix for stable release"
run = """
#!/usr/bin/env bash
set -euo pipefail
file="moon.mod.json"
current=$(grep '"version"' "$file" | head -1 | sed -E 's/.*"([0-9A-Za-z.+-]+)".*/\\1/')
base="${current%-alpha.*}"
if [ "$base" = "$current" ]; then
  echo "Already a stable version: $current"
  exit 0
fi
sed -i '' "s/\\\"version\\\": \\\"${current}\\\"/\\\"version\\\": \\\"${base}\\\"/" "$file"
echo "Released $base"
"""
